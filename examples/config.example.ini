; Example defaults for the CLI / console.
; Copy to config.ini and edit (config.ini is gitignored).

[9router]
; base URL of your 9Router instance
base = http://localhost:20128
; 9Router login password (default 123456; set INITIAL_PASSWORD for remote setups)
password = 123456

[claim]
; pre-solved Aliyun captchaVerifyParam (usually filled by the console automatically)
captcha_param =

[solverify]
; optional third-party Aliyun solver — works for generic Aliyun, NOT accepted by this claim
client_key =
; HTTP proxy required by the solver host:port[,host:port...]
proxy =
